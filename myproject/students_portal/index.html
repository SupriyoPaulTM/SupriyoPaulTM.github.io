<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Management</title>
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lora|Poppins">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  
  <link rel="stylesheet" href="style.css" type="text/css" media="all" />
</head>

<body>
  <header>
    <h1>Student Management</h1>
  </header>
  <div class="list-container" id="list-container">
    <div class="container-header">
      <h3>Student List</h3>
      <button id="add-btn">+ Add New</button>
    </div>
    <div class="container-items" id="container-items">
      list goes here
    </div>
  </div>
  <div class="form-container" id="form-container">
    <div class="container-header">
      <h3>Addmission Form</h3>
      <button id="back-btn"> &lt;&lt; back</button>
    </div>
    <form>
      <label for="fname">First Name<span class="warn">*</span></label>
      <input type="text" name="fname" id="fname" required>
      <label for="lname">Last Name<span class="warn">*</span></label>
      <input type="text" name="lname" id="lname" required>
      <label for="class">Class<span class="warn">*</span></label>
      <input type="number" name="class" id="class" required>
      <button id="submit-btn">Submit</button>
    </form>
  </div>
  <div class="popup" id="popup">
    <h3>
      Update Student
    </h3>
    <form>
      <label for="fname">First Name<span class="warn">*</span></label>
      <input type="text" name="fname" id="editfname" required>
      <label for="lname">Last Name<span class="warn">*</span></label>
      <input type="text" name="lname" id="editlname" required>
      <label for="class">Class<span class="warn">*</span></label>
      <input type="number" name="class" id="editclass" required>
    </form>
    <div class="btns">
      <button class="btn cancel" onclick="closeMenu()">Cancel</button>
      <button class="btn edit" id="saveEdit">Save</button>
    </div>
  </div>
  <div class="overlay" id="overlay"></div>
  <script src="main.js" type="text/javascript" charset="utf-8"></script>
</body>

</html>
